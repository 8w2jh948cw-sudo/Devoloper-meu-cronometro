<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <title>Recuperar Cronômetro</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f5f7;color:#111114;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}section{width:min(100%,390px);background:#fff;border-radius:22px;padding:22px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.07)}h1{font-size:22px;margin:0 0 8px}.tag{display:inline-block;margin:0 0 10px;padding:5px 8px;border-radius:999px;background:#e9f2ff;color:#007aff;font-size:10px;font-weight:800;letter-spacing:.08em}.tag.beta{background:#fff0dc;color:#c56a00}p{font-size:14px;line-height:1.45;color:#6e6e73;margin:0}.ok{color:#238636}.bad{color:#d92d20}.bar{height:6px;background:#e8e8ed;border-radius:999px;overflow:hidden;margin:18px 0}.bar span{display:block;height:100%;width:18%;background:#007aff;border-radius:inherit;animation:move .9s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(430%)}}.actions{display:grid;gap:9px;margin-top:16px}.actions a{text-decoration:none;text-align:center;padding:12px 14px;border-radius:13px;background:#111114;color:#fff;font-size:14px;font-weight:600}.actions a.secondary{background:#ececf1;color:#111114}@media(prefers-color-scheme:dark){html,body{background:#111114;color:#f7f7f8}section{background:#1c1c1e;box-shadow:none}p{color:#a1a1a6}.bar{background:#2c2c2e}.actions a{background:#f2f2f4;color:#111114}.actions a.secondary{background:#2c2c2e;color:#f7f7f8}}
  </style>

  <link rel="icon" type="image/png" sizes="192x192" href="./app-icon-beta-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./app-icon-beta-192.png">
</head>
<body><main><section>
  <span id="env" class="tag">OFICIAL</span><h1 id="title">Recuperando o Cronômetro</h1>
  <p id="status">Removendo somente cache e Service Worker da interface. Seus registros e configurações não serão apagados.</p>
  <div class="bar" id="bar"><span></span></div>
  <div class="actions" id="actions" hidden><a href="./launch.html?v=0.8.9-beta.2&recover=1">Abrir o app novamente</a><a class="secondary" href="./safe.html?v=0.8.9-beta.2&recover=1">Abrir modo seguro</a></div>
</section></main>
<script>
(async()=>{
  const BETA=location.pathname.includes('/beta/');const basePath=new URL('./',location.href).pathname;const env=document.getElementById('env');if(BETA){env.textContent='BETA';env.classList.add('beta')}
  const status=document.getElementById('status'),actions=document.getElementById('actions'),bar=document.getElementById('bar');
  const cacheMatch=k=>BETA?k.startsWith('cronometro-beta-'):(k.startsWith('cronometro-')&&!k.startsWith('cronometro-beta-'));
  try{
    let workers=0,cachesRemoved=0;
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();const targets=regs.filter(r=>{try{return new URL(r.scope).pathname===basePath}catch(_){return false}});const results=await Promise.allSettled(targets.map(r=>r.unregister()));workers=results.filter(r=>r.status==='fulfilled'&&r.value).length}
    if('caches' in window){const keys=await caches.keys();const results=await Promise.allSettled(keys.filter(cacheMatch).map(k=>caches.delete(k)));cachesRemoved=results.filter(r=>r.status==='fulfilled'&&r.value).length}
    status.className='ok';status.textContent=`Interface recuperada: ${workers} Service Worker(s) e ${cachesRemoved} cache(s) removido(s). Os dados ${BETA?'da Beta':'Oficiais'} foram preservados.`;bar.hidden=true;actions.hidden=false;
    try{localStorage.setItem(`cronometro-${BETA?'beta-':'official-'}last-recovery`,new Date().toISOString())}catch(_){}
    setTimeout(()=>location.replace(`./launch.html?v=0.8.9-beta.2&recover=${Date.now()}`),900);
  }catch(error){status.className='bad';status.textContent='A recuperação da interface não terminou. Nenhum registro foi apagado. Use o modo seguro para verificar os dados.';bar.hidden=true;actions.hidden=false}
})();
</script></body></html>
